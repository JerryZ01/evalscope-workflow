# EvalScope Workflow — Nginx Configuration
# 1. Serve frontend static files
# 2. Reverse-proxy /api/* and /health to backend service
# 3. SSE-friendly tweaks for /api/eval/stream/

upstream backend {
    server backend:5900;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 字符集 + 通用安全头
    charset utf-8;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # 单文件最大 50MB（评测报告 HTML / JSON 可能较大）
    client_max_body_size 50m;

    # ---------- SSE 流（任务进度推送） ----------
    # 必须关闭 proxy_buffering，否则浏览器收不到实时事件
    location ~ ^/api/eval/(stream|log)/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding off;

        # 关闭压缩，保证 SSE 实时性
        gzip off;
    }

    # ---------- 普通 API 反代 ----------
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # ---------- Health 检查直通 ----------
    location /health {
        proxy_pass http://backend;
        access_log off;
    }

    # ---------- 静态前端 (SPA fallback) ----------
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 资源文件长缓存
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        root /usr/share/nginx/html;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
