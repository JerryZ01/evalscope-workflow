[project]
name = "evalscope-workflow-backend"
version = "1.0.0"
description = "EvalScope 评测工作流引擎后端"
requires-python = ">=3.10"
dependencies = [
    # Core
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "aiosqlite>=0.19.0",
    # Task Queue
    "celery>=5.3.0",
    "redis>=5.0.0",
    # EvalScope
    "evalscope==1.7.0",
    # API Clients
    "httpx>=0.25.0",
    "openai>=1.3.0",
    # Config & Utilities
    "pyyaml>=6.0.0",
    "python-dateutil>=2.8.2",
    "python-multipart>=0.0.6",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.6.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
